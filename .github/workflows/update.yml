name: Update Fund Data

on:
  schedule:
    # Каждый день в 19:30 UTC (=22:30 МСК летом, 21:30 зимой)
    - cron: "30 19 * * 1-5"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          pip install -r requirements.txt

      - name: Run parser
        run: |
          python parser.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add fund214.csv

          git diff --cached --quiet || (
            git commit -m "Auto update fund data"
            git push
          )